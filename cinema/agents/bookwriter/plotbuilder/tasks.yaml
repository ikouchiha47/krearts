    ## IMPORTANT OBJECTS DETECTION (MANDATORY)

    For EACH panel, you MUST identify important objects that should NOT be covered by text overlays.
    
    Add an `important_objects` field to each panel with bounding boxes for:
    - **Main character/person**: Use VISUAL descriptions, not names
      - ✅ GOOD: "man in trenchcoat and fedora", "detective in dark coat", "person in center"
      - ❌ BAD: "Jack", "Detective Morgan" (vision AI doesn't know character names)
      - Only mark if character is prominent (medium/close shots, not background figures)
    - **Faces**: ONLY in extreme close-ups where face fills 60%+ of frame
      - Use: "man's face", "woman's face", "person's face with hat"
    - **Evidence and clues**: cigarette butts, glove fibers, ledger pages, blood pools, weapons, baseball cards
      - Be specific: "cigarette butt with red lipstick", "torn ledger page"
    - **Props being interacted with**: "door handle", "gun in hand", "photograph being held"
    - **Story-critical details**: Specific objects that advance the plot
    
    **DO NOT mark as important:**
    - Background people/figures
    - Large background elements (entire buildings, walls, floors)
    - Generic environmental objects (rain, puddles, sky)
    - Decorative elements
    
    **Guidelines by shot type:**
    - **Close-up/Medium shot**: Mark "man in trenchcoat" or "detective figure"
    - **Extreme close-up of face**: Mark "man's face with fedora"
    - **Wide/Establishing shot**: Usually NO important objects
    - **Action shot**: Mark main person + props they're using
    
    Bounding box format:
    ```json
    "important_objects": [
      {
        "box_2d": [y_min, x_min, y_max, x_max],
        "label": "cigarette butt with lipstick"
      },
      {
        "box_2d": [100, 200, 300, 400],
        "label": "Jack's face"
      }
    ]
    ```
    
    Coordinates are normalized (0-1000 range) where:
    - [0, 0] = top-left corner
    - [1000, 1000] = bottom-right corner
    - Format: [y_min, x_min, y_max, x_max]
    
    **Guidelines:**
    - **Limit to 2-4 most important objects per panel** (the things that MUST NOT be covered)
    - For close-ups: The main subject (face, object) fills 40-80% of frame
    - For medium shots: Character faces/hands are in upper-middle area (30-60% of frame)
    - For wide/establishing shots: Usually NO important objects (text can go anywhere)
    - **Think like a letterer**: What would ruin the panel if covered by a speech bubble?
    
    **Examples of GOOD important objects:**
    - "man in trenchcoat and fedora" (medium shot - protects whole figure)
    - "detective in dark coat" (character is the focus)
    - "man's face with hat" (extreme close-up only)
    - "cigarette butt with red lipstick" (evidence clue)
    - "door handle" (prop being touched)
    - "torn ledger page in hand" (evidence being examined)
    - "woman in black dress" (character description)
    
    **Examples of BAD important objects:**
    - "Jack" or "Detective Morgan" (vision AI doesn't know names!)
    - "Jack's face" (use "man's face" instead)
    - "his hand" (use "hand on door handle" or just mark the person)
    - "warehouse exterior" (too large, just background)
    - "rain puddles" (decorative)
    - "city skyline" (background)
    
    **Example:**
    ```json
    {
      "panel_number": 5,
      "shot_type": "close-up",
      "visual_description": "Close-up of cigarette butt with red lipstick on filter, lying on concrete...",
      "important_objects": [
        {
          "box_2d": [300, 350, 700, 650],
          "label": "cigarette butt with lipstick"
        }
      ]
    }
    ```

