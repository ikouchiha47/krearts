critique:
  expected_output: >
    A detailed critique report in markdown format with:
    1. PASS/FAIL verdict for each principle check
    2. Severity-ranked list of violations (CRITICAL, HIGH, MEDIUM, LOW)
    3. Specific actionable fixes for each violation
    4. Evidence density score and recommendations

  description: |
    You are critiquing a detective storyline against established detective story principles.
    
    Your task is to validate the storyline against these MANDATORY checks:
    
    ## EVIDENCE DISTRIBUTION CHECKLIST (MUST PASS)
    
    ### 1. Evidence Density Check
    - Count total clues mentioned in the storyline
    - REQUIREMENT: ≥ 5 clues total
    - REQUIREMENT: ≥ 2 clues that directly implicate the killer
    - REQUIREMENT: ≥ 1 clue that directly exonerates the framed suspect
    - FAIL if any requirement not met
    
    ### 2. Red Herring Balance
    - Count red herrings vs. true clues
    - REQUIREMENT: Red herrings ≤ 40% of total clues
    - FAIL if red herrings dominate
    
    ### 3. Motivation Tie-In (Concrete Stakes)
    - For EACH alliance/betrayal, verify there is concrete proof:
      * Financial transaction (ledger, bank transfer, receipt)
      * Reputational threat (document, email, recording, witness statement)
      * Physical evidence (contract, letter, photograph)
    - CRITICAL FAIL if any alliance/betrayal lacks concrete proof
    
    ### 4. Temporal Plausibility
    - Verify killer has opportunity (timestamped presence or gap in logs)
    - Check alibi contradictions are documented
    - FAIL if killer's presence at crime scene is not established
    
    ### 5. Forensic Corroboration (Multilayered Evidence)
    - REQUIREMENT: At least ONE physical clue connecting killer to scene:
      * DNA/blood type
      * Fiber (clothing, glove, carpet)
      * Fingerprints or glove marks
      * Tool marks or weapon trace
      * Unique physical marks (cleaning patterns, polishing abrasions)
    - FAIL if only circumstantial evidence exists
    
    ---

    # **SPECIFIC CRITIQUE POINTS (General-Purpose Version)**

    These checks apply to *all* detective stories, regardless of characters, setting, or plot structure.
    They evaluate the structural integrity, forensic rigor, and logical plausibility of the narrative.

    ---

    ## **0. Detective Primacy & POV (Universal Rule)**

    * Exactly one **Primary Detective** must exist, explicitly designated.
    * Every detective listed in the story must appear in the Characters roster with the role `detective`.
    * If multiple detectives exist, a **POV allocation plan** must be identifiable.
    * The Primary Detective must own **≥ 60% of meaningful investigative beats** (interviews, deductions, clue interpretation, reveals).
    * **FAIL** if:

      * No primary detective is declared
      * Another character performs more critical investigative functions than the primary
      * POV control becomes fragmented or unclear

    ---

    ## **A. Accomplice / Witness Motivation Integrity**

    Every accomplice, witness, co-conspirator, or betrayer must have **documented, concrete motivation**.

    The critique agent must check:

    1. **Concrete Stakes**
      Each alliance or betrayal requires *at least one* of the following:

      * Financial incentive (payment, debt, bribe, asset transfer, inheritance dispute)
      * Reputational leverage (blackmail material, damaging documents, witness statements)
      * Physical or situational leverage (compromise, coercion, incriminating items)

    2. **Mutual Risk / Mutual Benefit**
      Alliances must make sense from both sides.
      Each participant needs:

      * Something to gain
      * Something to lose
      * A rational reason not to betray the other prematurely

    3. **Plausible Calculus**
      Motivation must align with:

      * Personality traits
      * Prior behavior
      * Risk exposure
      * Stakes in the core conflict

    **CRITICAL** if any alliance, betrayal, or assistance occurs without identifiable and concrete stakes.

    ---

    ## **B. Forensic Evidence Quality & Multilayer Corroboration**

    A detective narrative must support deductions with **multiple categories of evidence**, not just circumstantial hints.

    Checks:

    1. **Forensic Variety**
      Evaluate if the story includes at least two distinct forms of physical evidence, such as:

      * Fingerprints / glove marks
      * DNA / blood / fluids
      * Fibers (clothing, carpet, rope)
      * Tool marks / weapon residue
      * Chemical traces
      * Document analysis (paper, ink, stationery)
      * Digital footprints (timestamps, logs)

    2. **Provenance Traceability**
      Each physical clue must have a clear chain:

      * Where it was found
      * Why it matters
      * What it connects to
      * Whether it can be falsified or contested

    3. **Corroboration**
      A key deduction should never rely on a single clue type.
      Layers must support each other (e.g., fingerprint + ledger + timestamp).

    **MEDIUM severity** if only one type of forensic evidence exists.
    **FAIL** if the story relies entirely on circumstantial logic.

    ---

    ## **C. Framing / Misdirection Plausibility**

    For any framed suspect:

    1. **Mechanism of Evidence Placement**
      The story must provide:

      * How the framing evidence was introduced
      * When it was introduced
      * Why it wasn’t immediately detected as planted

    2. **Plausible Perception**
      The framed suspect must:

      * Have a believable reason to fall under suspicion
      * Fit the apparent surface evidence
      * Have timing/location plausibility

    3. **Detectable Slip**
      The eventual unmasking must arise from:

      * A subtle inconsistency
      * A mismatched detail
      * A forensic contradiction
      * A behavioral tell
      * A timeline breach

    If the framing feels arbitrary or contrived: **HIGH severity**.

    ---

    ## **D. Clue Provenance & Deduction Validity**

    Every major deduction by the detective must map to **explicit clues** reachable by a reader.

    Checklist:

    1. **Traceability**
      Each deduction should refer to:

      * A clue
      * A testimony
      * A document
      * A timestamp
      * A behavior
      * A visual detail

    2. **No Leapfrogging**
      Deductions cannot skip steps or rely on unstated insider logic.

    3. **Reader-Reconstructability**
      A hypothetical reader should be able to:

      * List clues
      * Rebuild the reasoning chain
      * Reach the same interim conclusions

    **CRITICAL** if any key reveal happens without evidence.

    ---

    ## **E. Red Herring Explainability & Narrative Hygiene**

    Red herrings (false or misleading clues) must follow these rules:

    1. **Mundane Foundations**
      They must arise from:

      * Routine behavior (cleaning, habits, misunderstandings)
      * Coincidences that still obey causality
      * Misinterpreted but real data

    2. **No Supernatural or Arbitrary Artifacts**
      Red herrings cannot rely on:

      * Mystical misdirections
      * Unexplained interventions
      * Deus-ex-machina anomalies

    3. **Resolution Requirement**
      Every red herring must be explained away during or before the final reveal.

    4. **Impact Boundaries**
      Red herrings should add tension but must not overshadow the true evidence structure.

    **LOW severity** unless they actively undermine logic.

    ---

    
    ## OUTPUT FORMAT
    
    ```markdown
    # Detective Storyline Critique Report
    
    ## Executive Summary
    - Overall Verdict: PASS / FAIL
    - Critical Issues: [count]
    - High Priority Issues: [count]
    - Medium Priority Issues: [count]
    - Low Priority Issues: [count]
    
    ## Evidence Distribution Checklist
    
    ### 1. Evidence Density: PASS/FAIL
    - Total clues found: [X]
    - Clues implicating killer: [X]
    - Clues exonerating framed suspect: [X]
    - **Verdict**: [PASS/FAIL with explanation]
    
    ### 2. Red Herring Balance: PASS/FAIL
    - Red herrings: [X]
    - True clues: [X]
    - Ratio: [X%]
    - **Verdict**: [PASS/FAIL with explanation]
    
    ### 3. Motivation Tie-In: PASS/FAIL
    - Butler-Price alliance: [concrete proof present? Y/N]
    - [Other alliances]: [concrete proof present? Y/N]
    - **Verdict**: [PASS/FAIL with explanation]
    
    ### 4. Temporal Plausibility: PASS/FAIL
    - Killer opportunity established: [Y/N]
    - Timeline gaps documented: [Y/N]
    - **Verdict**: [PASS/FAIL with explanation]
    
    ### 5. Forensic Corroboration: PASS/FAIL
    - Physical evidence types: [list]
    - Multilayered: [Y/N]
    - **Verdict**: [PASS/FAIL with explanation]

    ## Detailed Critique
    
    ### CRITICAL Issues (Must Fix)
    1. **[Issue Title]**
       - **Problem**: [Specific description]
       - **Evidence**: [Quote from storyline or "MISSING"]
       - **Fix**: [Actionable recommendation]
       - **Priority**: CRITICAL
    
    ### HIGH Priority Issues
    [Same format as above]
    
    ### MEDIUM Priority Issues
    [Same format as above]
    
    ### LOW Priority Issues
    [Same format as above]
    
    ## Recommended Fixes (Prioritized)
    
    1. [Most critical fix]
    2. [Second most critical fix]
    3. [etc.]
    
    ## Strengths
    - [What the storyline does well]
    
    ## Final Recommendation
    If the storyline is structurally sound and passes all mandatory evidence and plausibility checks.
    No more recommendations are needed and the Verdict should be a pass.
    [Overall assessment and next steps, to strengthen the plot line, and improves plausibility, iff needed.]


    ## Final Binary Verdict
    - PASS / IMPROVE

    IMPROVE, if any of these are present:
    - CRITICAL ISSUES
    - HIGH Priority Issues
    - MEDIUM Priority issues
    - Recommended Fixes

    ```
