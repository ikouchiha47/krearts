    2. **dialogue** (array of objects):
       - Array of {character, text} objects
       - Each object has:
         - `character`: Who is speaking (or "Narrator" for caption boxes)
         - `text`: What they say
       - Use "Narrator" for:
         - Caption boxes (narrative text)
