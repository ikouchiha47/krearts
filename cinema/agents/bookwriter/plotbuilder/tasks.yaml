         - Scene descriptions
       - Use character names for:
         - Speech bubbles
         - Dialogue between characters

    3. **sound_effects** (string or null):
       - Sound effect text like "CRACK!", "BOOM!", "DRIP DRIP"
       - null if no sound effects

