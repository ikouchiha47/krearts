plotbuilder:
  detective:
    expected_output: >
      A comprehensive list of character profiles, their backstory,
      and the story connecting the plotline

    description: |
      Given this FIXED plot structure (you cannot change the logic, only describe it)

      Your task is to:
      - Generate character personas and backstories, their motivations, and quirks
      - Narrative descriptions for each relationship
      - Build a solid plotline for a detective story, with the created characters.
        Making sure the motivations and behaviours serve the storyline.

      You MAY add:
      - Vivid descriptions
      - Character personalities
      - Atmospheric details
      - Emotional depth

      ---

      ## Knowledge
      Present In memory

      - Glossary containting definitons of different knowledge base categories (eg: narrative-structures, storytelling-techniques, storywriting)
      - Story Writing Principles (storywriting/detective/principles.md)

      - Narrative Patterns:
        - Intent: Detective-specific STORYTELLING TECHNIQUES for reveals and interrogations
        - File: storywriting/detective/storytelling-techniques.md
      - Available Narrative Structures:
        - Intent: HOW to organize the story timeline
        - File: knowledge/narrative-structures/index.md
      - Art Styles:
        - Intent: Visual art styles for comic book generation
        - File: knowledge/art-styles/index.md
        - Character Guidelines: knowledge/art-styles/character-guidelines.md
        - Style Combinations: knowledge/art-styles/combinations.md

      ## Tool USAGE
      - Using the knowledge/narrative-structures/index.md find the proper narrative structure (linear/non-linear)
      - Using the knowledge/art-styles/index.md find appropriate art style(s) for the story
      - Use the DirectoryReadTool to understand the file structure in narrative-structures and art-styles
      - And the FileReadTool to read the detailed narrative structures and art style references
      - **ALWAYS use the DirectoryReadTool tool before FileReadTool**

      ## Art Style Selection
      - Available art styles: {allowed_art_styles}
      - User selected art styles: {selected_art_styles}
      - If user selected styles, USE THEM (they can be combined)
      - If no styles selected, choose from available styles based on story tone
      - Art styles can be COMBINED (e.g., "noir + cyberpunk", "anime + pop-art")
      - See art-styles/combinations.md for proven combinations
      - For sci-fi stories:
        - Use "sci-fi" for clean, optimistic future aesthetics
        - Use "cyberpunk" for dystopian, gritty, neon-drenched aesthetics
      - Include selected art styles in storyline metadata
      - From directories, files and knowledgebase, choose the best possible styles matching intent.

      IMPORTANT:
      - Text inside (), [] and <> are instructions or intent
      - **ALWAYS** use the GLOSSARY to get the correct file paths

      ---

      ## User Requirements (Optional Seed)
      
      {user_requirements}

      <logic>
      if user_requirements is provided:
        - Use these as creative constraints and inspiration
        - Incorporate themes, settings, character types mentioned
        - Respect any specific requests (era, location, tone, etc.)
        - Build the story around these requirements
      else:
        - Create story freely based on plot structure
      </logic>

      ---

      ## Plot Structure (1)

      ### CHARACTERS
      {characters}

      ### RELATIONSHIPS (FIXED):
      {relationships}

      ### Roles (FIXED):
      - Killer: {killer}
      - Victim: {victim}
      - Accomplices: {accomplices}
      - Witnesses: {witnesses}
      - Betrayals: {betrayals}

      ### Detective Declaration (ENFORCED)
      - You MUST declare detective primacy explicitly:
        - Primary Detective: <name>  (this character MUST have role `detective`)
        - Secondary Detectives (optional): [<name>, ...] (each MUST have role `detective`)
      - If multiple detectives exist, include a POV Plan: the primary owns ≥ 60% of investigative beats; label POV in key scenes.

      ---

      Respond in the markdown heirarchical format
      **STRICTLY ADHERE TO THE BELOW FORMAT**

      ---

      ## World & Era Context

      - Era and Time Window: <e.g., 1950s Noir / Contemporary / Near-Future>
      - Geography and Setting: <city/region, urban/rural, climate>
      - Culture and Traditions: <norms impacting behavior/conflict>
      - Socital Constructs: <how society was defined during the era, the definitions of good and bad>
      - Geopolitics and Legal Context: <jurisdiction, legal constraints>
      - Technology Level and Forensics: <tools available, limitations>
      - Policing Style and Jurisdiction: <detective's authority, procedures>
      - Media Environment: <press influence, public perception>
      - Thematic Constraints: <tone, taboos, social dynamics>

      ## Characters

      ---
  
      ### Character 1 (index)
      
      **Name:** <full name>
      **Physical Traits:** <detailed physical description. this should emobody the characters beliefs, allowing the reader to feel the differences or similarites>
      **Ethnicity:** <ethnicity>
      **Age:** <age>
      **Quirks:** <list of quirks>
      **Clothing:** <type of clothings prefered>

      #### Backstory
      (in details)
      <name> is a calculating individual with a dark secret.
      <name>  was a wealthy and influential figure.
      (and how they met or knew or are related to the main victim)
      
      #### Role
      IMPORTANT: Use EXACTLY ONE of these role names (do not invent new roles):
      - killer: The person who committed the murder
      - victim: The person who was killed
      - accomplice: Helped the killer before/during/after the crime
      - witness: Saw something suspicious (may be eliminated later)
      - betrayal: Betrayed an ally or accomplice
      - detective: Investigates the crime
      - framed_suspect: Falsely implicated by planted evidence (red herring)

      #### Actions & Locations
      A date and time wise breakdown of:
      - what the person did
      - where the person was
      - what role the person played
      - allibies

      All the actions before, during and after the discovery of the crime has to be accounted for.
      ex: first saw the body, discreetly seeked in medicine, was reading a newspaper, was asleep.

      The Actions done should deeply matter to the character, and hence the reader.

      #### Motivations
      The actions commited by the person, and the reasons for doing so. It has to come from
      the backstory, their role and their actions.

      #### World View and Cultural Context
      This is individual character's:
      - Cultural
      - Emotional, and
      - Philosophical beliefs.

      How the character feels in the world era and context of the story timeline.
      How are the pros and cons of the socital constructs, as seen from the character's ideology

      #### Identity Anchors
      - Core beliefs
      - Core values
      - **Behavioral Patterns**
      - vices
      - secrets, and
      - ideologies that drive decisions.
      
      These should be set with respect to the World context.

      #### Long-term Goals
      Career/personal goals and current constraints.

      #### Relationships Graph Notes
      Key allies, rivals, obligations; how ties influence choices.

      #### Triggers and Stress Responses
      What escalates them and how they react under pressure.
      Emotional conflicts
      Philosophical conflicts

      #### Skills / Toolkit (Era-Appropriate)
      Practical skills and tools available given the era and context.

      #### Memory Hooks
      - Canonical facts to persist in the character node for future evolution.
      - 3-6 bullet points, specific and verifiable from backstory/actions.


      ---

      ### Character N
      [repeat the above structure for each character]
      ...


      All the character definitions and attributes, should be designed
      to serve the conflicts and tensions and evolution of the characters
      in the detailed storyline, later.

      ---

      ## Storyline

      ### Metadata
      - Title: <title of the book (max. 1-3 words)>
      - Theme: <description>
      - Genre: <description>
      - Adults Only: <boolean>
      - Narrative Structure: "<linear or non-linear>/<which_specfic_structure>" (linear/five-act)
      - Art Style: <description>
      - Story Telling Style: <description>
      - Suited For: movie, shorts, microdrama, tv-show, novel, short-story, comic book
      - Colors: list of color name with their hex codes. (<color_name>(#<hex_code>)...)
      - Cover/Thumbnail Image Concept: <description>

      ### Detailed Storyline
      The entire storyline told using one of the narrative-styles in knowledgebase.

      ----

      ## References
      - [Which parts of knowledgebase was used for understanding]
      - [Files were actually used for narrative-structures.]
        This will be used in the next stage, for quick accessing files.

      ---

      ## Context
      {storyline}

      ---

      ## Improvement Feedback

      {feedback}

      <logic>
      if "IMPROVE" in feedback:
        Use the feedback to improve the storyline.
      
      if "REWRITE" in feedback:
        Use the feedback to rewrite the storyline.

      else:
        Ignore, and do nothing to influence the storyline.
      </logic>

      ---

      ## MANDATORY GUIDELINES

      - You MUST NOT change:
      - Who did what
      - Timeline order
      - Relationships
      - Logic structure
      - Use the knowledgebase to have a better understading on writer better detective plotline

      - **IMPORTANT**: Make sure to reflect on the storylines, and **make sure** it's **structurally sound** and passes **all mandatory evidence** and **plausibility checks**,
        like, **lives of people depend on it**.      

      ---

      To invoke suspense and anticipation (Zeigarnik effect):
      Build up to climatic events where they occur, choosing the final action as a countdown
      - Anchor the plot to a tangible central event
      - Underlying current of momentum, leading upto it (central event)

      ---

      ## **CRITICAL COHERENECE VALIDATIONS**:
  
      - One primary detective with POV control.
      - Every alliance needs concrete stakes + mutual risk/benefit.
      - Use multiple forensic evidence types (2+), each with clear provenance.
      - Any framing needs mechanism + plausibility + a detectable flaw.
      - Every deduction must map to explicit clues; no leaps.
      - Red herrings must be grounded, explainable, and resolved.
      - Detective Primacy Rule: 
        You MUST designate exactly one Primary Detective by name.
        Secondary detectives are allowed but optional; all detectives must be clearly labeled and appear in the Characters list with role `detective`.
        If multiples exist, provide a POV Plan (primary ≥ 60%).
    
      ---

      ## Examples
      {examples}

critique:
  detective:
    expected_output: >
      A detailed critique report in markdown format with:
      1. PASS/FAIL verdict for each principle check
      2. Severity-ranked list of violations (CRITICAL, HIGH, MEDIUM, LOW)
      3. Specific actionable fixes for each violation
      4. Evidence density score and recommendations

    description: |
      You are critiquing a detective storyline against established detective story principles.
      
      Your task is to validate the storyline against these MANDATORY checks:
      
      ## EVIDENCE DISTRIBUTION CHECKLIST (MUST PASS)
      
      ### 1. Evidence Density Check
      - Count total clues mentioned in the storyline
      - REQUIREMENT: ≥ 5 clues total
      - REQUIREMENT: ≥ 2 clues that directly implicate the killer
      - REQUIREMENT: ≥ 1 clue that directly exonerates the framed suspect
      - FAIL if any requirement not met
      
      ### 2. Red Herring Balance
      - Count red herrings vs. true clues
      - REQUIREMENT: Red herrings ≤ 40% of total clues
      - FAIL if red herrings dominate
      
      ### 3. Motivation Tie-In (Concrete Stakes)
      - For EACH alliance/betrayal, verify there is concrete proof:
        * Financial transaction (ledger, bank transfer, receipt)
        * Reputational threat (document, email, recording, witness statement)
        * Physical evidence (contract, letter, photograph)
      - CRITICAL FAIL if any alliance/betrayal lacks concrete proof
      
      ### 4. Temporal Plausibility
      - Verify killer has opportunity (timestamped presence or gap in logs)
      - Check alibi contradictions are documented
      - FAIL if killer's presence at crime scene is not established
      
      ### 5. Forensic Corroboration (Multilayered Evidence)
      - REQUIREMENT: At least ONE physical clue connecting killer to scene:
        * DNA/blood type
        * Fiber (clothing, glove, carpet)
        * Fingerprints or glove marks
        * Tool marks or weapon trace
        * Unique physical marks (cleaning patterns, polishing abrasions)
      - FAIL if only circumstantial evidence exists
      
      ---

      # **SPECIFIC CRITIQUE POINTS (General-Purpose Version)**

      These checks apply to *all* detective stories, regardless of characters, setting, or plot structure.
      They evaluate the structural integrity, forensic rigor, and logical plausibility of the narrative.

      ---

      ## **0. Detective Primacy & POV (Universal Rule)**

      * Exactly one **Primary Detective** must exist, explicitly designated.
      * Every detective listed in the story must appear in the Characters roster with the role `detective`.
      * If multiple detectives exist, a **POV allocation plan** must be identifiable.
      * The Primary Detective must own **≥ 60% of meaningful investigative beats** (interviews, deductions, clue interpretation, reveals).
      * **FAIL** if:

        * No primary detective is declared
        * Another character performs more critical investigative functions than the primary
        * POV control becomes fragmented or unclear

      ---

      ## **A. Accomplice / Witness Motivation Integrity**

      Every accomplice, witness, co-conspirator, or betrayer must have **documented, concrete motivation**.

      The critique agent must check:

      1. **Concrete Stakes**
        Each alliance or betrayal requires *at least one* of the following:

        * Financial incentive (payment, debt, bribe, asset transfer, inheritance dispute)
        * Reputational leverage (blackmail material, damaging documents, witness statements)
        * Physical or situational leverage (compromise, coercion, incriminating items)

      2. **Mutual Risk / Mutual Benefit**
        Alliances must make sense from both sides.
        Each participant needs:

        * Something to gain
        * Something to lose
        * A rational reason not to betray the other prematurely

      3. **Plausible Calculus**
        Motivation must align with:

        * Personality traits
        * Prior behavior
        * Risk exposure
        * Stakes in the core conflict

      **CRITICAL** if any alliance, betrayal, or assistance occurs without identifiable and concrete stakes.

      ---

      ## **B. Forensic Evidence Quality & Multilayer Corroboration**

      A detective narrative must support deductions with **multiple categories of evidence**, not just circumstantial hints.

      Checks:

      1. **Forensic Variety**
        Evaluate if the story includes at least two distinct forms of physical evidence, such as:

        * Fingerprints / glove marks
        * DNA / blood / fluids
        * Fibers (clothing, carpet, rope)
        * Tool marks / weapon residue
        * Chemical traces
        * Document analysis (paper, ink, stationery)
        * Digital footprints (timestamps, logs)

      2. **Provenance Traceability**
        Each physical clue must have a clear chain:

        * Where it was found
        * Why it matters
        * What it connects to
        * Whether it can be falsified or contested

      3. **Corroboration**
        A key deduction should never rely on a single clue type.
        Layers must support each other (e.g., fingerprint + ledger + timestamp).

      **MEDIUM severity** if only one type of forensic evidence exists.
      **FAIL** if the story relies entirely on circumstantial logic.

      ---

      ## **C. Framing / Misdirection Plausibility**

      For any framed suspect:

      1. **Mechanism of Evidence Placement**
        The story must provide:

        * How the framing evidence was introduced
        * When it was introduced
        * Why it wasn’t immediately detected as planted

      2. **Plausible Perception**
        The framed suspect must:

        * Have a believable reason to fall under suspicion
        * Fit the apparent surface evidence
        * Have timing/location plausibility

      3. **Detectable Slip**
        The eventual unmasking must arise from:

        * A subtle inconsistency
        * A mismatched detail
        * A forensic contradiction
        * A behavioral tell
        * A timeline breach

      If the framing feels arbitrary or contrived: **HIGH severity**.

      ---

      ## **D. Clue Provenance & Deduction Validity**

      Every major deduction by the detective must map to **explicit clues** reachable by a reader.

      Checklist:

      1. **Traceability**
        Each deduction should refer to:

        * A clue
        * A testimony
        * A document
        * A timestamp
        * A behavior
        * A visual detail

      2. **No Leapfrogging**
        Deductions cannot skip steps or rely on unstated insider logic.

      3. **Reader-Reconstructability**
        A hypothetical reader should be able to:

        * List clues
        * Rebuild the reasoning chain
        * Reach the same interim conclusions

      **CRITICAL** if any key reveal happens without evidence.

      ---

      ## **E. Red Herring Explainability & Narrative Hygiene**

      Red herrings (false or misleading clues) must follow these rules:

      1. **Mundane Foundations**
        They must arise from:

        * Routine behavior (cleaning, habits, misunderstandings)
        * Coincidences that still obey causality
        * Misinterpreted but real data

      2. **No Supernatural or Arbitrary Artifacts**
        Red herrings cannot rely on:

        * Mystical misdirections
        * Unexplained interventions
        * Deus-ex-machina anomalies

      3. **Resolution Requirement**
        Every red herring must be explained away during or before the final reveal.

      4. **Impact Boundaries**
        Red herrings should add tension but must not overshadow the true evidence structure.

      **LOW severity** unless they actively undermine logic.

      ---

      
      ## OUTPUT FORMAT
      
      ```markdown
      # Detective Storyline Critique Report
      
      ## Executive Summary
      - Overall Verdict: PASS / FAIL
      - Critical Issues: [count]
      - High Priority Issues: [count]
      - Medium Priority Issues: [count]
      - Low Priority Issues: [count]
      
      ## Evidence Distribution Checklist
      
      ### 1. Evidence Density: PASS/FAIL
      - Total clues found: [X]
      - Clues implicating killer: [X]
      - Clues exonerating framed suspect: [X]
      - **Verdict**: [PASS/FAIL with explanation]
      
      ### 2. Red Herring Balance: PASS/FAIL
      - Red herrings: [X]
      - True clues: [X]
      - Ratio: [X%]
      - **Verdict**: [PASS/FAIL with explanation]
      
      ### 3. Motivation Tie-In: PASS/FAIL
      - Butler-Price alliance: [concrete proof present? Y/N]
      - [Other alliances]: [concrete proof present? Y/N]
      - **Verdict**: [PASS/FAIL with explanation]
      
      ### 4. Temporal Plausibility: PASS/FAIL
      - Killer opportunity established: [Y/N]
      - Timeline gaps documented: [Y/N]
      - **Verdict**: [PASS/FAIL with explanation]
      
      ### 5. Forensic Corroboration: PASS/FAIL
      - Physical evidence types: [list]
      - Multilayered: [Y/N]
      - **Verdict**: [PASS/FAIL with explanation]

      ## Detailed Critique
      
      ### CRITICAL Issues (Must Fix)
      1. **[Issue Title]**
        - **Problem**: [Specific description]
        - **Evidence**: [Quote from storyline or "MISSING"]
        - **Fix**: [Actionable recommendation]
        - **Priority**: CRITICAL
      
      ### HIGH Priority Issues
      [Same format as above]
      
      ### MEDIUM Priority Issues
      [Same format as above]
      
      ### LOW Priority Issues
      [Same format as above]
      
      ## Recommended Fixes (Prioritized)
      
      1. [Most critical fix]
      2. [Second most critical fix]
      3. [etc.]
      
      ## Strengths
      - [What the storyline does well]
      
      ## Final Recommendation
      If the storyline is structurally sound and passes all mandatory evidence and plausibility checks.
      No more recommendations are needed and the Verdict should be a pass.
      [Overall assessment and next steps, to strengthen the plot line, and improves plausibility, iff needed.]


      ## Final Binary Verdict
      - PASS / IMPROVE

      IMPROVE, if any of these are present:
      - CRITICAL ISSUES
      - HIGH Priority Issues
      - MEDIUM Priority issues
      - Recommended Fixes

      ```
