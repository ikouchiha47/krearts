services:
  cinema:
    build: .
    ports:
      - "8000:8000"  # API
      - "5174:5173"  # Frontend
    volumes:
      - ./output:/app/output
      - ./datastore:/app/datastore  # Only mount output directory
    environment:
      - PYTHONPATH=/app
      - ENVIRONMENT=production
      - CINEMA_ROOT=/app
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

