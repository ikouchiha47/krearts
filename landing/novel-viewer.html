<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Red Lotus - Novel & Graphic Novel Viewer</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Read Blood Red Lotus - A noir detective graphic novel with character-consistent AI-generated art. Split-view reader with screenplay and comic panels.">
    <meta name="keywords" content="Blood Red Lotus, noir detective, graphic novel, AI comics, visual novel, detective mystery">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="book">
    <meta property="og:title" content="Blood Red Lotus - Noir Detective Graphic Novel">
    <meta property="og:description" content="A character-consistent noir detective graphic novel. Read the screenplay alongside the comic panels in this split-view reader.">
    <meta property="og:image" content="https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=1200">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Blood Red Lotus - Noir Detective Graphic Novel">
    <meta name="twitter:description" content="A character-consistent noir detective graphic novel. Read the screenplay alongside the comic panels.">
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=1200">
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Crimson+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Feather Icons -->
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    
    <!-- Marked.js for Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            overflow: hidden;
        }
        
        .header {
            background: #1a1a1a;
            border-bottom: 1px solid #333;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.25rem;
            font-weight: 700;
            color: #fff;
        }
        
        .logo-icon {
            color: #ff6b6b;
        }
        
        .header-controls {
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        
        .btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: #ff6b6b;
            color: white;
        }
        
        .btn-primary:hover {
            background: #ff5252;
        }
        
        .btn-secondary {
            background: #2a2a2a;
            color: #e0e0e0;
            border: 1px solid #444;
        }
        
        .btn-secondary:hover {
            background: #333;
        }
        
        .container {
            display: flex;
            height: calc(100vh - 65px);
        }
        
        .panel {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
            position: relative;
        }
        
        .panel-header {
            position: sticky;
            top: 0;
            background: #0a0a0a;
            padding: 1rem 0;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid #333;
            z-index: 10;
        }
        
        .panel-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .divider {
            width: 1px;
            background: #333;
            cursor: col-resize;
            position: relative;
        }
        
        .divider:hover {
            background: #ff6b6b;
        }
        
        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 40px;
            background: #2a2a2a;
            border-radius: 20px;
            border: 1px solid #444;
        }
        
        /* Markdown Styles */
        .markdown-content {
            font-family: 'Crimson Pro', serif;
            line-height: 1.8;
            max-width: 800px;
        }
        
        .markdown-content h1 {
            font-size: 2.5rem;
            margin: 2rem 0 1rem;
            color: #fff;
            font-weight: 700;
        }
        
        .markdown-content h2 {
            font-size: 2rem;
            margin: 2rem 0 1rem;
            color: #ff6b6b;
            font-weight: 600;
        }
        
        .markdown-content h3 {
            font-size: 1.5rem;
            margin: 1.5rem 0 0.75rem;
            color: #ffa07a;
            font-weight: 600;
        }
        
        .markdown-content p {
            margin: 1rem 0;
            color: #d0d0d0;
        }
        
        .markdown-content strong {
            color: #fff;
            font-weight: 600;
        }
        
        .markdown-content em {
            color: #b0b0b0;
            font-style: italic;
        }
        
        .markdown-content ul, .markdown-content ol {
            margin: 1rem 0;
            padding-left: 2rem;
        }
        
        .markdown-content li {
            margin: 0.5rem 0;
            color: #d0d0d0;
        }
        
        .markdown-content blockquote {
            border-left: 4px solid #ff6b6b;
            padding-left: 1rem;
            margin: 1rem 0;
            color: #b0b0b0;
            font-style: italic;
        }
        
        .markdown-content code {
            background: #1a1a1a;
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            color: #ff6b6b;
        }
        
        .markdown-content pre {
            background: #1a1a1a;
            padding: 1rem;
            border-radius: 8px;
            overflow-x: auto;
            margin: 1rem 0;
        }
        
        .markdown-content pre code {
            background: none;
            padding: 0;
        }
        
        /* PDF Viewer Styles */
        .pdf-container {
            background: #1a1a1a;
            border-radius: 8px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        
        .pdf-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            padding: 0.5rem;
            background: #2a2a2a;
            border-radius: 6px;
        }
        
        .pdf-controls button {
            padding: 0.5rem 1rem;
            background: #333;
            border: 1px solid #444;
            color: #e0e0e0;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .pdf-controls button:hover {
            background: #444;
        }
        
        .pdf-controls button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .page-info {
            color: #b0b0b0;
            font-size: 0.9rem;
        }
        
        #pdf-canvas {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        
        .loading {
            text-align: center;
            padding: 2rem;
            color: #888;
        }
        
        .error {
            text-align: center;
            padding: 2rem;
            color: #ff6b6b;
        }
        
        /* Responsive */
        @media (max-width: 1024px) {
            .container {
                flex-direction: column;
            }
            
            .divider {
                display: none;
            }
            
            .panel {
                height: 50vh;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">
            <i data-feather="book-open" class="logo-icon"></i>
            <span>Blood Red Lotus</span>
        </div>
        <div class="header-controls">
            <button class="btn btn-secondary" onclick="window.location.href='index.html'">
                <i data-feather="arrow-left"></i>
                Back to Home
            </button>
            <button class="btn btn-primary" onclick="downloadPDF()">
                <i data-feather="download"></i>
                Download PDF
            </button>
        </div>
    </div>
    
    <div class="container">
        <!-- Markdown Panel -->
        <div class="panel" id="markdown-panel">
            <div class="panel-header">
                <h2 class="panel-title">
                    <i data-feather="file-text"></i>
                    Novel (Screenplay)
                </h2>
            </div>
            <div class="markdown-content" id="markdown-content">
                <div class="loading">Loading novel...</div>
            </div>
        </div>
        
        <!-- Divider -->
        <div class="divider"></div>
        
        <!-- PDF Panel -->
        <div class="panel" id="pdf-panel">
            <div class="panel-header">
                <h2 class="panel-title">
                    <i data-feather="image"></i>
                    Graphic Novel
                </h2>
            </div>
            <div class="pdf-container">
                <div class="pdf-controls">
                    <button id="prev-page" onclick="prevPage()">
                        <i data-feather="chevron-left"></i>
                        Previous
                    </button>
                    <span class="page-info">
                        Page <span id="page-num">1</span> of <span id="page-count">-</span>
                    </span>
                    <button id="next-page" onclick="nextPage()">
                        Next
                        <i data-feather="chevron-right"></i>
                    </button>
                </div>
                <canvas id="pdf-canvas"></canvas>
            </div>
        </div>
    </div>
    
    <script>
        // PDF.js setup
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        
        let pdfDoc = null;
        let pageNum = 1;
        let pageRendering = false;
        let pageNumPending = null;
        const scale = 1.5;
        const canvas = document.getElementById('pdf-canvas');
        const ctx = canvas.getContext('2d');
        
        // Load Markdown
        async function loadMarkdown() {
            try {
                const response = await fetch('releases/noir/novel.md');
                if (!response.ok) throw new Error('Failed to load novel');
                
                const markdown = await response.text();
                const html = marked.parse(markdown);
                document.getElementById('markdown-content').innerHTML = html;
            } catch (error) {
                document.getElementById('markdown-content').innerHTML = 
                    '<div class="error">Failed to load novel. Please try again later.</div>';
                console.error('Error loading markdown:', error);
            }
        }
        
        // Render PDF page
        function renderPage(num) {
            pageRendering = true;
            
            pdfDoc.getPage(num).then(function(page) {
                const viewport = page.getViewport({scale: scale});
                canvas.height = viewport.height;
                canvas.width = viewport.width;
                
                const renderContext = {
                    canvasContext: ctx,
                    viewport: viewport
                };
                
                const renderTask = page.render(renderContext);
                
                renderTask.promise.then(function() {
                    pageRendering = false;
                    if (pageNumPending !== null) {
                        renderPage(pageNumPending);
                        pageNumPending = null;
                    }
                });
            });
            
            document.getElementById('page-num').textContent = num;
        }
        
        function queueRenderPage(num) {
            if (pageRendering) {
                pageNumPending = num;
            } else {
                renderPage(num);
            }
        }
        
        function prevPage() {
            if (pageNum <= 1) return;
            pageNum--;
            queueRenderPage(pageNum);
        }
        
        function nextPage() {
            if (pageNum >= pdfDoc.numPages) return;
            pageNum++;
            queueRenderPage(pageNum);
        }
        
        // Load PDF
        async function loadPDF() {
            try {
                const loadingTask = pdfjsLib.getDocument('releases/noir/full_novel.pdf');
                pdfDoc = await loadingTask.promise;
                
                document.getElementById('page-count').textContent = pdfDoc.numPages;
                renderPage(pageNum);
                
                // Enable/disable buttons
                document.getElementById('prev-page').disabled = false;
                document.getElementById('next-page').disabled = false;
            } catch (error) {
                document.querySelector('.pdf-container').innerHTML = 
                    '<div class="error">Failed to load PDF. Please try again later.</div>';
                console.error('Error loading PDF:', error);
            }
        }
        
        function downloadPDF() {
            window.open('releases/noir/full_novel.pdf', '_blank');
        }
        
        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') prevPage();
            if (e.key === 'ArrowRight') nextPage();
        });
        
        // Initialize
        window.addEventListener('load', function() {
            loadMarkdown();
            loadPDF();
            feather.replace();
        });
    </script>
</body>
</html>
