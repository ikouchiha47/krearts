# Selection Rules
# ---------------
# The system can select references based on:
# 1. Shot type (establishing, wide, medium, close-up, extreme-close-up)
# 2. Scene type (action, dialogue, atmospheric, dramatic)
# 3. Panel arrangement (grid-8-panel, grid-9-panel, etc.)
# 4. Emotional tone (tense, relaxed, thrilling, etc.)
#
# Selection priority:
# 1. Specific match (e.g., "grid-9-panel" -> nine_panel_grid)
# 2. Category match (e.g., "action" -> motion_lines, impact_panel)
# 3. General references (use_for: ["all"])
