# Art Style Reference Image Manifest
#
# This file defines labeled reference images for each art style.
# Each reference has a specific purpose and can be selected based on scene requirements.
#
# IMPORTANT: Tags describe WHAT THE REFERENCE IMAGE SHOWS, not what you're generating.
# The system will match references to your output needs based on what they demonstrate.
#
# Example:
#   ✅ GOOD: Tag "motion_lines" means "this reference shows motion line technique"
#   ❌ BAD: Tag "grid-9-panel" means "use this for 9-panel grids" (too prescriptive)
#
# Instead, use use_for_panel_layouts to suggest when a reference is appropriate.

blueberry:
  description: "European ligne claire style by Jean Giraud (Moebius)"
  characteristics:
    - "Detailed realistic anatomy"
    - "Clean line work with variable weight"
    - "Detailed backgrounds (Western landscapes)"
    - "9-panel grid layouts"
    - "Muted, naturalistic colors"
  
  references:
    character_closeup:
      file: "character_closeup.jpg"
      purpose: "Character facial expressions and detailed portraits"
      use_for: ["close-up", "extreme-close-up", "character focus"]
      
    wide_landscape:
      file: "wide_landscape.jpg"
      purpose: "Western landscapes and environmental establishing shots"
      use_for: ["establishing", "wide", "environmental"]
      
    action_sequence:
      file: "action_sequence.jpg"
      purpose: "Dynamic action with realistic motion"
      use_for: ["action", "movement", "chase"]
      
    grid_layout:
      file: "grid_layout.jpg"
      purpose: "Example of dense sequential storytelling with multiple panels"
      use_for: ["dense", "sequential", "narrative"]
      # This reference SHOWS a 9-panel grid, so it's good for understanding that layout
      # But the tag describes WHAT IT SHOWS (dense, sequential), not the output format
      
    line_work:
      file: "line_work.jpg"
      purpose: "Clean ligne claire line work technique"
      use_for: ["all"]  # General style reference

